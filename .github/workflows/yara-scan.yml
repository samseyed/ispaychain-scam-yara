name: YARA Rule Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yara:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y yara
          yara --version

      - name: Validate YARA rules
        run: |
          set -e
          for rule in rules/*.yar rules/*.yara; do
            if [ -f "$rule" ]; then
              echo "Validating $rule"
              yara "$rule" "$rule"
            fi
          done

      - name: Run safe IOC fixture
        run: |
          if [ -f samples/test_indicator.txt ]; then
            yara rules/ispaychain_scam.yar samples/test_indicator.txt
          fi
