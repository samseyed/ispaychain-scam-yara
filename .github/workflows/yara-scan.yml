name: YARA Rule Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yara:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y yara
          yara --version

      - name: List YARA files
        run: |
          find . -type f ( -name '*.yar' -o -name '*.yara' ) -print

      - name: Validate YARA rules
        run: |
          set -e
          for rule in $(find rules -type f ( -name '*.yar' -o -name '*.yara' )); do
            echo "Validating: $rule"
            yara "$rule" "$rule"
          done
