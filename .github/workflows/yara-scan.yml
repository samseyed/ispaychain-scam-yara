- name: Validate rules and run safe fixture
        run: |
          set -e
          for rule in rules/*.yar rules/*.yara; do
            if [ -f "$rule" ]; then
              echo "Validating $rule"
              yara "$rule" "$rule"
            fi
          done

          if [ -f samples/test_indicator.txt ]; then
            echo "Running safe IOC fixture"
            yara rules/ispaychain_scam.yar samples/test_indicator.txt
          fi
