name: YARA Rule Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yara:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YARA
        run: |
          sudo apt-get update
          sudo apt-get install -y yara

      - name: Validate YARA rules
        run: |
          find rules -type f ( -name '*.yar' -o -name '*.yara' ) -print0 |
          while IFS= read -r -d '' rule; do
            echo "Validating $rule"
            yara "$rule" "$rule" || exit 1
          done
